### Proxies <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Proxies <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A hop that forwards, and maybe changes TLS, headers, auth, or destination <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "We put a proxy in front" is not a design until you say forward or reverse <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* And whether it is also the load balancer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Forward Proxy vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Forward Proxy vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Forward: the *client* chooses it; origin sees the proxy IP <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Egress, allowlists: [Squid](https://www.squid-cache.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Avoiding the public internet: [AWS PrivateLink](https://aws.amazon.com/privatelink/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reverse: *you* put it in front of origins; the client thinks it is the origin <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Forward Proxy vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Reverse products: [NGINX](https://nginx.org/), [Envoy](https://www.envoyproxy.io/), [HAProxy](https://www.haproxy.org/), [Caddy](https://caddyserver.com/), [Traefik](https://traefik.io/traefik/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [NGINX](https://nginx.org/): TLS, path routing, buffering on VMs — one box is still a SPOF <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Envoy](https://www.envoyproxy.io/): programmable L4/L7, HTTP/2, gRPC, mTLS, mesh data plane <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Squid](https://www.squid-cache.org/) is the wrong direction for inbound <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Load Balancer vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Load Balancer vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Reverse proxy: what you do to the request (TLS, headers, buffering, `/static`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Load balancer: which origin (health, spread, failover) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Many products are both: [NGINX](https://nginx.org/), [HAProxy](https://www.haproxy.org/), [Envoy](https://www.envoyproxy.io/), [ALB](https://aws.amazon.com/elasticloadbalancing/application-load-balancer/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Load Balancer vs Reverse Proxy <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* L4-only: [AWS Network Load Balancer](https://aws.amazon.com/elasticloadbalancing/network-load-balancer/), [Azure Load Balancer](https://azure.microsoft.com/products/load-balancer) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One origin, no health check → reverse proxy, not a balancer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name the product and the layer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Spread traffic across healthy replicas <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cloud: [AWS Elastic Load Balancing](https://aws.amazon.com/elasticloadbalancing/), [Google Cloud Load Balancing](https://cloud.google.com/load-balancing) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Azure Load Balancer](https://azure.microsoft.com/products/load-balancer), [Azure Application Gateway](https://azure.microsoft.com/products/application-gateway), [Azure Front Door](https://azure.microsoft.com/products/frontdoor) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Software: [NGINX](https://nginx.org/), [HAProxy](https://www.haproxy.org/), [Envoy](https://www.envoyproxy.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* DNS as a balancer does not connection-drain <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Layer 4 vs Layer 7 Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Layer 4 vs Layer 7 Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* L4: IP + port + TCP/UDP; cannot read a URL <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* L7: HTTP host, path, header, cookie; usually terminates TLS <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* L4 SKU: [AWS Network Load Balancer](https://aws.amazon.com/elasticloadbalancing/network-load-balancer/), [Azure Load Balancer](https://azure.microsoft.com/products/load-balancer) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* L7 SKU: [AWS Application Load Balancer](https://aws.amazon.com/elasticloadbalancing/application-load-balancer/), [Azure Application Gateway](https://azure.microsoft.com/products/application-gateway) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Layer 4 vs Layer 7 Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* ALB: HTTP/HTTPS/gRPC, host/path rules, TLS via [ACM](https://aws.amazon.com/certificate-manager/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* NLB: TCP/UDP/TLS, source-IP preservation, passthrough <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* NLB will not route `/payments`; ALB will not front [PostgreSQL](https://www.postgresql.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* HTTP user traffic → L7; non-HTTP or TLS you must not terminate → L4 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Routing Algorithms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Routing Algorithms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Round robin; weighted round robin <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Least connections; least response time (needs an honest metric) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Random / power of two choices <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* IP hash / cookie hash = stickiness, not a session store <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Routing Algorithms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Consistent hashing: later algorithms chapter; [Envoy](https://www.envoyproxy.io/) uses it for some clusters <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Maglev: [Google Cloud Load Balancing](https://cloud.google.com/load-balancing) L4 shape — [networking-in-depth post](https://cloud.google.com/blog/products/networking/google-cloud-networking-in-depth-how-and-why-we-chose-maglev-as-our-load-balancer) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [HAProxy](https://www.haproxy.org/) / [NGINX](https://nginx.org/) expose these as `balance` / `upstream` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stateless equal replicas → round robin or least connections <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Need stickiness → [Redis](https://redis.io/) first <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Health Checks, Sticky Sessions, and Failover <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Health Checks, Sticky Sessions, and Failover <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Active probes: [ELB](https://aws.amazon.com/elasticloadbalancing/) target health, [HAProxy](https://www.haproxy.org/) `httpchk` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Passive / outlier: [Envoy](https://www.envoyproxy.io/) ejects a 5xx-ing target <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Kubernetes probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/): readiness gates traffic; liveness restarts <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not point liveness at [PostgreSQL](https://www.postgresql.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cheap `/healthz`; deep dependency checks less often <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Health Checks, Sticky Sessions, and Failover <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Sticky sessions pin a client; replica death still drops in-RAM sessions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Store sessions in [Redis](https://redis.io/) / [Amazon ElastiCache](https://aws.amazon.com/elasticache/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Drain: [ELB](https://aws.amazon.com/elasticloadbalancing/) deregistration delay, [Kubernetes](https://kubernetes.io/) `preStop` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* DNS failover: [Amazon Route 53](https://aws.amazon.com/route53/), [Azure Traffic Manager](https://azure.microsoft.com/products/traffic-manager), [Cloudflare](https://www.cloudflare.com/) — TTL is the RTO floor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Clustering vs Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Clustering vs Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Load balancing: interchangeable stateless replicas; state lives elsewhere <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Clustering: membership, replication, quorum, shards <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [PostgreSQL](https://www.postgresql.org/) primary/standbys, [Redis Cluster](https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/), [Apache Kafka](https://kafka.apache.org/) brokers, [Kubernetes](https://kubernetes.io/) control plane <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You cannot round-robin writes at a single-writer primary and call it a cluster <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Clustering vs Load Balancing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Stateless APIs: balancer only — [Kubernetes Service](https://kubernetes.io/docs/concepts/services-networking/service/), [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/), [Gateway API](https://gateway-api.sigs.k8s.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Datastores: cluster first, then maybe [HAProxy](https://www.haproxy.org/) TCP to the primary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A fleet of caches behind a balancer is not [Redis Cluster](https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If nodes vote or own a key range, you clustered <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Checksums and Integrity on the Wire <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Checksums and Integrity on the Wire <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Fingerprint of bytes: "did this get flipped?" <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not encryption; a CRC is not authentication <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Integrity plus sender auth = MAC or AEAD — TLS ([RFC 8446](https://www.rfc-editor.org/rfc/rfc8446)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Ethernet CRC and IPv4 header checksum are not your app story <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Checksums and Integrity on the Wire <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* TCP checksum ([RFC 1071](https://www.rfc-editor.org/rfc/rfc1071)) is cheap and weak <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* After TLS termination, the next hop is uncovered unless you TLS again <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Object integrity: [SHA-256](https://csrc.nist.gov/pubs/fips/180-4/upd1/final), [Amazon S3 extra checksums](https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* HTTP [ETag](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/ETag) is a cache validator, not always a hash <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Checksums detect accidents; TLS (or a MAC) detects tampering <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Summary: Networking, Protocols, and Web Concepts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Summary: Networking, Protocols, and Web Concepts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Address, transport, name, HTTP, TLS, then a proxy or balancer <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* IP: [RFC 1918](https://www.rfc-editor.org/rfc/rfc1918) private vs public; CIDR in [Amazon VPC](https://aws.amazon.com/vpc/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* OSI: design at L3, L4, L7 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* TCP ([RFC 9293](https://www.rfc-editor.org/rfc/rfc9293)); UDP; HTTP/3 is [QUIC](https://www.rfc-editor.org/rfc/rfc9000) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* DNS: [Amazon Route 53](https://aws.amazon.com/route53/), [Cloudflare DNS](https://www.cloudflare.com/application-services/products/dns/), [CoreDNS](https://coredns.io/); TTL is failover math <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Networking, Protocols, and Web Concepts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* HTTP: [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110), [MDN](https://developer.mozilla.org/en-US/docs/Web/HTTP); sessions in [Redis](https://redis.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* TLS 1.3; [Let's Encrypt](https://letsencrypt.org/), [ACM](https://aws.amazon.com/certificate-manager/), [cert-manager](https://cert-manager.io/); mTLS via [SPIFFE](https://spiffe.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Forward [Squid](https://www.squid-cache.org/); reverse [NGINX](https://nginx.org/) / [Envoy](https://www.envoyproxy.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* L4 [NLB](https://aws.amazon.com/elasticloadbalancing/network-load-balancer/) vs L7 [ALB](https://aws.amazon.com/elasticloadbalancing/application-load-balancer/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Clustering ≠ load balancing; checksums ≠ TLS <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Draw it in [Excalidraw](https://excalidraw.com/). Next: API Design <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## API Design <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Client | → | Gateway | → | Service | → | Datastore |
| --- | --- | --- | --- | --- | --- | --- |
| speaks the contract |  | enforces policy |  | implements |  | state |

### What an API Must Make Obvious <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### What an API Must Make Obvious <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Audience: browser, mobile, partner, or another service <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Surface: resources, a graph, or procedures <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Authn / authz — Security chapter later; unauthenticated GET is a choice <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Failure: status + stable code + retry story ([RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Replay, pagination, version, quota <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What an API Must Make Obvious <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

### REST <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Fielding dissertation, chapter 5](https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Uniform interface: [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) methods and status <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Production REST ≈ HTTP + JSON + resource URLs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [MDN HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP); optional [JSON:API](https://jsonapi.org/), [HAL](https://datatracker.ietf.org/doc/html/draft-kelly-json-hal) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Default public API; GraphQL and gRPC must win on an axis <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Nouns in the URL, verbs in the method — `POST /deleteOrder` is RPC <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Resources, Verbs, and Status Contracts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Resources, Verbs, and Status Contracts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Method | Job | Idempotent? | Success |
| --- | --- | --- | --- |
| `GET` / `HEAD` | Read | Yes (safe) | `200` / `304` |
| `POST` | Create / action | No | `201` + `Location`, or `202` |
| `PUT` | Replace | Yes | `200` / `204` / `201` |
| `PATCH` | Partial ([RFC 5789](https://www.rfc-editor.org/rfc/rfc5789)) | Only if designed | `200` / `204` |
| `DELETE` | Remove | Yes | `204` |

*[RFC 9110](https://www.rfc-editor.org/rfc/rfc9110). Status is the contract, not a debug string.*

---

#### Resources, Verbs, and Status Contracts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* `4xx` — client must change something (`401` vs `403`, `409`, `429`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `5xx` — this hop failed (`503` + `Retry-After` vs `500` bug) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Create that returns `200` with an id in JSON is not a contract <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prove it with [curl](https://curl.se/) (`-i`, `-X`, `-H`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If you must parse JSON to learn "it failed," status is missing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Pagination, Filtering, and Versioning <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Pagination, Filtering, and Versioning <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Style | How | Cost |
| --- | --- | --- |
| Offset / limit | `offset=40` | Deep pages; rows drift under writes |
| Page number | `page=3` | Same drift |
| Cursor / keyset | opaque `cursor=` | No random access; stable sort |
| Link headers | [RFC 8288](https://www.rfc-editor.org/rfc/rfc8288) | Gateways must not strip them |

*Prefer opaque cursors on any public list.*

---

#### Pagination, Filtering, and Versioning <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Version | Honest when |
| --- | --- |
| `/v1/orders` | Public HTTP; gateways and [OpenAPI](https://www.openapis.org/) |
| `Accept` media type | One URL, many representations |
| Additive only | One client you ship |

*Compatible: add a field. Breaking: rename, remove, change type, change status. Sunset with [RFC 8594](https://www.rfc-editor.org/rfc/rfc8594).*

---

#### Pagination, Filtering, and Versioning <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Named query params; never `ORDER BY` in the query string <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Arbitrary nested filters → consider [GraphQL](https://graphql.org/), not a REST query language <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not bump `/v2` because you added a field <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Offset pages drift; cursors stay after the last id <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### GraphQL <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Query language + type system; usually `POST /graphql` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spec: [graphql.org](https://graphql.org/learn/); transport: [GraphQL over HTTP](https://http-spec.graphql.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Solves over-fetching and under-fetching <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Does not replace TLS, a gateway, or auth headers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### GraphQL <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| REST | GraphQL |
| --- | --- |
| `GET /users/1` | one `query { user { orders { items } } }` |
| `GET /users/1/orders` |  |
| `GET /orders/9/items` |  |

*Three round trips vs one. The N+1 moves into resolvers — [DataLoader](https://github.com/graphql/dataloader).*

---

### GraphQL <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Schema is the contract; mutations still need idempotency <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Authz is per field — `user { ssn }` is the client's next question <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Caching needs persisted queries ([Apollo](https://www.apollographql.com/)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GraphiQL](https://github.com/graphql/graphiql) explores; never with prod credentials <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Apollo](https://www.apollographql.com/) / [AWS AppSync](https://aws.amazon.com/appsync/) — not a datastore <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Single public CRUD is still REST <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### gRPC and RPC <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* RPC = call a function on another process <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [JSON-RPC](https://www.jsonrpc.org/); [Apache Thrift](https://thrift.apache.org/) is the older stack <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [gRPC](https://grpc.io/): [HTTP/2](https://www.rfc-editor.org/rfc/rfc9113) + [Protocol Buffers](https://protobuf.dev/) + generated stubs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Deadlines (`grpc-timeout`) are first-class <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### gRPC and RPC <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Call type | Shape |
| --- | --- |
| Unary | one req, one res |
| Server streaming | one req, many res |
| Client streaming | many req, one res |
| Bidirectional | both streams |

*If you only needed unary JSON, you wanted REST or [Connect](https://connectrpc.com/).*

---

### gRPC and RPC <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Browsers: [gRPC-Gateway](https://grpc-ecosystem.github.io/grpc-gateway/), [gRPC-Web](https://github.com/grpc/grpc-web), or [Connect](https://connectrpc.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* L7 HTTP/2: [Envoy](https://www.envoyproxy.io/), [ALB](https://aws.amazon.com/elasticloadbalancing/application-load-balancer/) — not a TCP [NLB](https://aws.amazon.com/elasticloadbalancing/network-load-balancer/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Status in trailers: [gRPC status codes](https://grpc.io/docs/guides/status-codes/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Buf](https://buf.build/) lints protobuf; [grpcurl](https://github.com/fullstorydev/grpcurl) is curl for gRPC <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Additive fields, `reserved` numbers, never reuse a field number <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Webhooks <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* You become the HTTP client; the subscriber is the server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Persist, then push — outbox / queue, not RAM <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Event type + version; breaking payload = new type <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Sign the body: [Standard Webhooks](https://www.standardwebhooks.com/), envelope: [CloudEvents](https://cloudevents.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spec file when the surface is events: [AsyncAPI](https://www.asyncapi.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Webhooks <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Your API | → | Outbox | → | Subscriber URL |
| --- | --- | --- | --- | --- |
| persist event |  | POST signed payload |  | `2xx` or retry with backoff |

*At-least-once. Receiver must be idempotent. Copy the shape from [GitHub Webhooks](https://docs.github.com/en/webhooks).*

### Idempotency in APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Idempotency in APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* GET / PUT / DELETE already claim it in [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* POST and GraphQL mutations do not — radios and gateways retry <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Client sends `Idempotency-Key` ([Stripe idempotent requests](https://docs.stripe.com/api/idempotent_requests)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same key + same body → stored response; same key + different body → `409` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Idempotency in APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Client | → | API | → | Key store |
| --- | --- | --- | --- | --- |
| POST + key |  | lookup |  | hit: replay / miss: execute once |

*Store: [Redis](https://redis.io/) TTL, [PostgreSQL](https://www.postgresql.org/) unique row, [Amazon DynamoDB](https://aws.amazon.com/dynamodb/) conditional write — not replica RAM.*

---

### Idempotency in APIs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Client owns the key; mint it before the first POST <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* TTL covers the retry window; forever is a leak <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prefer `PUT /orders/{id}` over a keyed `POST /orders` when the URL is the resource <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Exactly-once effect, at-least-once delivery (Distributed Systems later) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Rate Limiting as an API Concern <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Layer | Example | Sees |
| --- | --- | --- |
| Edge | [Cloudflare rate limiting](https://developers.cloudflare.com/waf/rate-limiting-rules/) | IP, path |

### Rate Limiting as an API Concern <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* HTTP: `429` ([RFC 6585](https://www.rfc-editor.org/rfc/rfc6585)) + `Retry-After` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Headers: `X-RateLimit-*` or IETF [RateLimit fields](https://datatracker.ietf.org/doc/html/draft-ietf-httpapi-ratelimit-headers) — pick one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Key on IP (NAT-hostile), API key, user/tenant, route, resource <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cheap checks at the edge; semantic quotas in the app <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A limit you cannot explain to a client is just an outage <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Error Contracts and Backward Compatibility <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details (`application/problem+json`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Status is the class; stable `code` is for branches <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `request_id` on every error; no stack traces in `detail` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Compatible: add optional field, endpoint, enum the old client ignores <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Breaking: rename, remove, change type, change status, tighten validation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Error Contracts and Backward Compatibility <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Deprecation is a protocol: `Sunset` ([RFC 8594](https://www.rfc-editor.org/rfc/rfc8594)), changelog, both versions live <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Metrics on `/v1` until they are actually zero <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Pact](https://docs.pact.io/); [Spectral](https://stoplight.io/open-source/spectral) / [Buf](https://buf.build/) breaking-change CI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [OpenAPI Generator](https://openapi-generator.tech/) still needs a versioned spec <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Old clients keep working without a release, or it is a new version <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Summary: API Design <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Contract: [OpenAPI](https://www.openapis.org/), [GraphQL](https://graphql.org/) SDL, or protobuf <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* GraphQL: many shapes + [DataLoader](https://github.com/graphql/dataloader); not a datastore <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* gRPC: service-to-service; browsers get [Connect](https://connectrpc.com/) or REST <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Gateway enforces; BFF shapes per client <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Summary: API Design <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Indexes, Materialized Views, and the N+1 Problem <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Index = derived structure; every index taxes writes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### ACID, BASE, CAP, and PACELC <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **ACID** — local transaction ([PostgreSQL transactions](https://www.postgresql.org/docs/current/tutorial-transactions.html)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **BASE** — stale allowed; here is repair ([Pritchett, ACM Queue](https://queue.acm.org/detail.cfm?id=1394128)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **CAP** — in a **partition**, C vs A ([Gilbert and Lynch](https://www.comp.nus.edu.sg/~gilbert/pubs/BrewersConjecture-SigAct.pdf); [Brewer, 12 years later](https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **PACELC** — else latency vs consistency ([Abadi](https://doi.org/10.1109/MC.2012.33)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### ACID, BASE, CAP, and PACELC <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

flowchart TB

  p -->|yes| ac[Availability vs Consistency]
  p -->|Else| lc[Latency vs Consistency]
```

*CAP is the failure branch. PACELC adds the happy path — sync vs async replication. Reciting "we are AP" without partition behavior is trivia.*

### Transactions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Local = one database <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Distributed = two or more systems — ACID is not free <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A transaction that calls another HTTP API is not local anymore <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Local Transactions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Local Transactions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Level | Still possible | Default-ish |
| --- | --- | --- |
| Read committed | non-repeatable, phantoms | [PostgreSQL](https://www.postgresql.org/) |
| Repeatable read | phantoms (engine-dependent) | [InnoDB](https://dev.mysql.com/doc/refman/en/innodb-storage-engine.html) |
| Serializable | — | Safer; more retries |

*[Isolation levels](https://www.postgresql.org/docs/current/transaction-iso.html) are not durability. Name both.*

---

#### Local Transactions <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [MVCC](https://www.postgresql.org/docs/current/mvcc.html): readers do not block writers; vacuum is the tax <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Optimistic: version column / `If-Match`; retry on 0 rows <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Pessimistic: `SELECT … FOR UPDATE` — short, or deadlock <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Default read committed; bump isolation where money or inventory hurts <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Distributed Transactions, Two-Phase Commit, and Sagas <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Distributed Transactions, Two-Phase Commit, and Sagas <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```mermaid
sequenceDiagram
  participant C as Coordinator
  participant X as Store X
  participant Y as Store Y
  C->>X: PREPARE
  C->>Y: PREPARE
  X-->>C: yes
  Y-->>C: yes
  C->>X: COMMIT
  C->>Y: COMMIT
```

*2PC ([`PREPARE TRANSACTION`](https://www.postgresql.org/docs/current/sql-prepare-transaction.html)). The sad path: voted yes, coordinator gone, locks held. Not a microservice architecture.*

---

#### Distributed Transactions, Two-Phase Commit, and Sagas <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Saga: local txns + compensations ([Garcia-Molina and Salem](https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Orchestration: [AWS Step Functions](https://aws.amazon.com/step-functions/), [Temporal](https://temporal.io/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Choreography: events on [Apache Kafka](https://kafka.apache.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Outbox + [Debezium](https://debezium.io/) — not dual-write <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Two databases → saga or outbox, not 2PC over HTTP <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

| Topology | Who writes | Conflict |

| Single-leader | One primary | Stale reads; [PostgreSQL streaming](https://www.postgresql.org/docs/current/warm-standby.html), [RDS](https://aws.amazon.com/rds/) Multi-AZ, [MongoDB replica sets](https://www.mongodb.com/docs/manual/replication/) |

#### Synchronous vs Asynchronous Replication <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Synchronous vs Asynchronous Replication <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Mode | Client wait | RPO on failover |
| --- | --- | --- |
| Async | Leader fsync | Lag window |
| Sync | Leader + replica | ~0 to that replica |
| Quorum | `W` of `N` | 0 if quorums overlap |

*[synchronous_commit](https://www.postgresql.org/docs/current/runtime-config-wal.html#GUC-SYNCHRONOUS-COMMIT), [MySQL semi-sync](https://dev.mysql.com/doc/refman/en/replication-semisync.html), [Aurora](https://aws.amazon.com/rds/aurora/) storage quorum.*

---

#### Synchronous vs Asynchronous Replication <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```mermaid
sequenceDiagram
  participant C as Client
  participant L as Leader
  participant R as Replica
  C->>L: WRITE
  alt sync
    L->>R: WAL
    R-->>L: flushed
    L-->>C: ack
  else async
    L-->>C: ack
    L->>R: WAL later
  end
```

*Sync is on the latency budget. Async is on the RPO budget. That is PACELC's "else."*

### Sharding, Partitioning, and Federation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Partition: split **inside** one database <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Shard: split **across** primaries ([Citus](https://www.citusdata.com/), [Vitess](https://vitess.io/), [Spanner](https://cloud.google.com/spanner) ranges) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Federation: split by **type** (users DB, orders DB) — a service cut <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Pooling is not sharding: [PgBouncer](https://www.pgbouncer.org/), [RDS Proxy](https://aws.amazon.com/rds/proxy/), [ProxySQL](https://proxysql.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Sharding, Partitioning, and Federation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```mermaid
flowchart TB
  app[App / router]
  s0[(shard 0)]
  s1[(shard 1)]
  s2[(shard 2)]
  app --> s0
  app --> s1
  app --> s2
```

*Cross-shard joins are distributed transactions. Avoid them. Partition inside one node first; replica reads second; shard writes last.*

#### Shard Keys That Age Well <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Shard Keys That Age Well <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Key | Age |
| --- | --- |
| `user_id` / `tenant_id` | Usually good; watch whales |
| Auto-increment / `created_at` | Hotspot on the newest shard |
| Hash of `id` | Even writes; range queries scatter |
| Random | Even; "all orders for user" needs a directory |

---

#### Shard Keys That Age Well <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```mermaid
flowchart LR
  writes[Inserts with created_at]
  newest[(newest range shard)]
  writes --> newest
```

*Monotonic keys concentrate writes. Hot keys: cache, split (`user_id#bucket`), or isolate the whale. The shard key **is** the design.*

#### Resharding and Directory-Based Routing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Resharding and Directory-Based Routing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

| Routing | Reshard |
| --- | --- |
| Hash `% N` | Almost every key moves; consistent hashing (later) moves `1/N` |
| Range | Split a range; hot ranges still hurt |
| Directory | Move a key by updating the map; directory is a SPOF unless replicated |

*[Vitess](https://vitess.io/) resharding, [DynamoDB](https://aws.amazon.com/dynamodb/) splits. Cache + version the directory; fence the old shard.*

---

#### Resharding and Directory-Based Routing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Plan the reshard **before** the disk is at 90% <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Dual-write during the move; stale directory cache is the dangerous window <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A hash modulo you cannot change is a hostage situation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Directory in [PostgreSQL](https://www.postgresql.org/) or [etcd](https://etcd.io/) — replicate it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### When to Pick SQL vs NoSQL <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

```mermaid
flowchart TB
  rec{System of record?}
  rec -->|blobs| s3[Object storage]
  rec -->|relations, unknown queries, ACID| sql[PostgreSQL]
  rec -->|known key, huge scale| nosql[Specialist]
  rec -->|graph walks| graph[Graph store]
```

*Record first, model second, growth third. [PostgreSQL](https://www.postgresql.org/) remains the default box.*

---

### When to Pick SQL vs NoSQL <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

1. Name the system of record <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
2. List the queries — unknown joins → SQL; one key → KV <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
3. Local ACID for money / inventory / uniqueness <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
4. Blobs out: [S3](https://aws.amazon.com/s3/) / [GCS](https://cloud.google.com/storage) / [Azure Blob](https://azure.microsoft.com/products/storage/blobs) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
5. Growth: replicas, then a shard key, then conflict rules or NewSQL <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
6. Derived stays derived — not [Elasticsearch](https://www.elastic.co/elasticsearch) or [Redis](https://redis.io/) as the record <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Summary: Databases and Storage <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Durability and query contract — not a logo <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Metadata in a row store; bytes in object storage <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* SQL default ([PostgreSQL](https://www.postgresql.org/), [Aurora](https://aws.amazon.com/rds/aurora/)); [EXPLAIN](https://www.postgresql.org/docs/current/sql-explain.html); no N+1 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* NoSQL is a model ([DynamoDB](https://aws.amazon.com/dynamodb/), [MongoDB](https://www.mongodb.com/), [Cassandra](https://cassandra.apache.org/), [Neo4j](https://neo4j.com/)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* ACID local; CAP is a partition; PACELC is the daily knob <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Databases and Storage <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Two databases → saga or outbox ([Debezium](https://debezium.io/)), not 2PC over HTTP <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Replication: topology + sync vs async (RPO) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Shard key that ages; router ([Vitess](https://vitess.io/), [Citus](https://www.citusdata.com/)); pooling is not sharding <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Draw it in [Excalidraw](https://excalidraw.com/). Next: Caching and Content Delivery Networks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
